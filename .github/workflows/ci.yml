name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CopilotSessionTray.slnx

      - name: Build
        run: dotnet build CopilotSessionTray.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/CopilotSessionTray.Core.Tests/CopilotSessionTray.Core.Tests.csproj --configuration Release --no-build
