name: "Copilot Setup Steps"

# Runs automatically whenever this file changes (so you can validate it in a
# PR/Actions run), and is also used by GitHub Copilot's cloud coding agent to
# prepare its ephemeral environment before it starts working on a task.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Must be named exactly `copilot-setup-steps` or Copilot will not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # NOTE: CopilotSessionTray.App targets net10.0-windows (WPF) and cannot
      # be restored/built on this Ubuntu-based agent runner. Only Core and
      # Core.Tests are cross-platform, so only those are set up here. Copilot
      # can implement/test Core.Contracts interfaces in this environment, but
      # cannot compile or run the App project — scope agent tasks accordingly.
      - name: Restore Core + Core.Tests
        run: |
          dotnet restore src/CopilotSessionTray.Core/CopilotSessionTray.Core.csproj
          dotnet restore src/CopilotSessionTray.Core.Tests/CopilotSessionTray.Core.Tests.csproj
