name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained, single-file, win-x64)
        run: >
          dotnet publish src/CopilotSessionTray.App/CopilotSessionTray.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Zip published output
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath CopilotSessionTray-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} CopilotSessionTray-*.zip --title "CopilotSessionTray ${{ github.ref_name }}" --generate-notes
