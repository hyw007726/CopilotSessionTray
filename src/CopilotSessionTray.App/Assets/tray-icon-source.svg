<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Minimal multi-armed bodhisattva tray icon</title>
  <desc id="desc">
    A compact, solemn bodhisattva seated in lotus posture, with raised arms, prayer hands at the chest, and lower hands resting on the knees.
  </desc>

  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26.5 30C21.5 35 23 43 29.5 42.5" stroke-width="8.5" />
        <path d="M37.5 30C42.5 35 41 43 34.5 42.5" stroke-width="8.5" />
      </g>
      <path
        d="M32 33C35 36 35 41 32 44C29 41 29 36 32 33Z"
        fill="#000" stroke="#000" stroke-width="3"
      />
    </mask>
  </defs>

  <g fill="currentColor">
    <!-- Halo -->
    <path
      fill-rule="evenodd"
      d="M32 4a15 15 0 1 0 0 30 15 15 0 0 0 0-30Zm0 5a10 10 0 1 1 0 20 10 10 0 0 1 0-20Z"
      opacity=".28"
    />

    <g mask="url(#gap)">
      <!-- Upper and middle rear arms -->
      <path d="M27 27c-5-1-8-5-12-9-1-1-3 1-2 3 4 6 8 10 14 12Z" />
      <path d="M24 31c-6 0-10-1-15-3-2-1-3 2-1 3 5 4 10 6 16 6Z" />
      <path d="M37 27c5-1 8-5 12-9 1-1 3 1 2 3-4 6-8 10-14 12Z" />
      <path d="M40 31c6 0 10-1 15-3 2-1 3 2 1 3-5 4-10 6-16 6Z" />

      <!-- Lower arms down to the knees -->
      <path d="M26 35c-6 1-10 5-11 10l-1 3c0 2 3 2 3.5 0l.5-2c1-3 4-6 8-7Z" />
      <path d="M38 35c6 1 10 5 11 10l1 3c0 2-3 2-3.5 0l-.5-2c-1-3-4-6-8-7Z" />

      <!-- Hands resting on top of the knees -->
      <ellipse cx="14.5" cy="49.5" rx="3.4" ry="2.4" transform="rotate(-15 14.5 49.5)" />
      <ellipse cx="49.5" cy="49.5" rx="3.4" ry="2.4" transform="rotate(15 49.5 49.5)" />

      <!-- Head -->
      <circle cx="32" cy="19" r="7" />

      <!-- Torso -->
      <path
        d="M26 28c-3 5-4 10-3 16l2 8h14l2-8c1-6 0-11-3-16
           c-2 3-4 4-6 4s-4-1-6-4Z"
      />

      <!-- Crossed legs: one wide, flat shape with rounded knees -->
      <path
        d="M7 54c0-4 4-6 8-5 6 2 12 4 17 4s11-2 17-4c4-1 8 1 8 5
           c0 3-4 4-8 4H15c-4 0-8-1-8-4Z"
      />

      <!-- Pedestal -->
      <path d="M12 60.5h40c1 0 1.5.6 1.5 1.5s-.5 1.5-1.5 1.5H12c-1 0-1.5-.6-1.5-1.5s.5-1.5 1.5-1.5Z" />
    </g>

    <!-- Front arms in anjali mudra -->
    <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26.5 30C21.5 35 23 43 29.5 42.5" />
      <path d="M37.5 30C42.5 35 41 43 34.5 42.5" />
    </g>
    <path d="M32 33C35 36 35 41 32 44C29 41 29 36 32 33Z" />
  </g>
</svg>
